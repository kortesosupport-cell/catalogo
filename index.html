<style>
  :root{
    --gold:#CDA156; --gold-soft:#e0bd7e;
    --terra:#6D301C; --terra-dark:#551f12;
    --ink:#1a120d; --paper:#f4ece2; --white:#ffffff;
    --bar-h:64px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Montserrat',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    background:var(--terra-dark); color:var(--ink); line-height:1.5;
    padding-bottom:calc(var(--bar-h) + env(safe-area-inset-bottom));
  }

  /* ---------- LANGUAGE SWITCH ---------- */
  .langbar{
    position:sticky;top:0;z-index:40;
    display:flex;justify-content:center;gap:8px;
    background:rgba(26,18,13,.96);backdrop-filter:blur(8px);
    padding:8px;border-bottom:1px solid rgba(205,161,86,.4);
  }
  .langbar button{
    font-family:inherit;font-weight:700;font-size:14px;letter-spacing:1px;
    color:var(--paper);background:transparent;border:1.5px solid rgba(205,161,86,.5);
    padding:6px 18px;border-radius:999px;cursor:pointer;transition:.15s;
  }
  .langbar button.active{background:var(--gold);color:var(--ink);border-color:var(--gold);}

  /* ---------- HEADER ---------- */
  header.hero{
    background:linear-gradient(160deg,var(--terra) 0%,var(--terra-dark) 100%);
    color:var(--paper);text-align:center;padding:30px 20px 26px;position:relative;overflow:hidden;
  }
  header.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;
    background:linear-gradient(90deg,var(--terra),var(--gold),var(--terra));}
  .kicker{font-size:13px;letter-spacing:4px;text-transform:uppercase;color:var(--gold-soft);font-weight:600;margin-bottom:6px;}
  .hero h1{font-size:clamp(34px,11vw,58px);font-weight:900;line-height:.95;letter-spacing:1px;text-transform:uppercase;}
  .hero h1 .pro{display:inline-block;background:var(--gold);color:var(--ink);padding:0 12px;border-radius:6px;margin-top:6px;}
  .hero p.sub{margin-top:14px;font-size:15px;color:#e9dccb;font-weight:400;max-width:520px;margin-left:auto;margin-right:auto;}
  .scroll-hint{margin-top:18px;font-size:12px;letter-spacing:2px;color:var(--gold-soft);text-transform:uppercase;font-weight:600;}
  .scroll-hint span{display:inline-block;animation:bounce 1.6s infinite;}
  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}

  /* ---------- FLIPBOOK ---------- */
  .book{max-width:760px;margin:0 auto;padding:18px 12px 30px;}
  .page{
    background:var(--white);border-radius:10px;overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,.35);margin-bottom:18px;line-height:0;
    opacity:0;transform:translateY(24px);transition:opacity .6s ease,transform .6s ease;
  }
  .page.in{opacity:1;transform:none;}
  .page img{width:100%;height:auto;display:block;}

  /* ---------- CONTACT ---------- */
  .contact{background:linear-gradient(160deg,var(--terra) 0%,var(--terra-dark) 100%);
    color:var(--paper);text-align:center;padding:40px 22px 48px;border-top:5px solid var(--gold);}
  .contact h2{font-size:26px;font-weight:800;margin-bottom:6px;}
  .contact .name{color:var(--gold);font-weight:700;font-size:19px;letter-spacing:1px;margin:14px 0 22px;text-transform:uppercase;}
  .contact p.lead{font-size:15px;color:#e9dccb;max-width:460px;margin:0 auto;font-weight:400;}
  .links{display:flex;flex-direction:column;gap:12px;max-width:380px;margin:26px auto 0;}
  .links a{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.07);
    border:1px solid rgba(205,161,86,.35);color:var(--paper);text-decoration:none;
    padding:14px 18px;border-radius:12px;font-weight:600;font-size:16px;transition:background .2s,transform .1s;}
  .links a:active{transform:scale(.98);}
  .links a:hover{background:rgba(205,161,86,.2);}
  .links a .ico{flex:0 0 26px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;}
  .links a .ico svg{width:24px;height:24px;}
  .links a small{display:block;font-weight:400;font-size:12px;color:#c9b79f;}
  .links a .txt{text-align:left;}

  footer.foot{background:var(--ink);color:#8a7b6b;text-align:center;font-size:12px;padding:22px 18px;line-height:1.6;}
  footer.foot strong{color:var(--gold);}

  /* ---------- FLOATING BAR ---------- */
  .bar{position:fixed;left:0;right:0;bottom:0;z-index:50;
    height:calc(var(--bar-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
    background:rgba(26,18,13,.97);backdrop-filter:blur(8px);border-top:2px solid var(--gold);display:flex;}
  .bar a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    color:var(--paper);text-decoration:none;font-size:11px;font-weight:600;transition:background .15s;}
  .bar a:active{background:rgba(205,161,86,.18);}
  .bar a svg{width:24px;height:24px;}
  .bar a.wa svg{color:#25D366;} .bar a.call svg{color:var(--gold-soft);}
  .bar a.mail svg{color:#7fb3ff;} .bar a.fb svg{color:#5a8cff;}
  .bar a + a{border-left:1px solid rgba(255,255,255,.08);}
  @media(min-width:680px){.bar{left:50%;transform:translateX(-50%);max-width:440px;border-radius:16px 16px 0 0;border:2px solid var(--gold);border-bottom:none;}}
</style>

<script>
  var TOTAL = 14;
  var I18N = {
    es:{
      htmllang:"es",
      kicker:"Una vida plena con", brand:"Bienestar",
      sub:"Descubre el maravilloso mundo de los hongos y cómo actúan en el organismo.",
      scroll:"Desliza para ver el catálogo",
      ctitle:"¿Cómo contactarme?",
      clead:"Hoy puede ser el comienzo de un verdadero cambio en tu vida. Me gustaría acompañarte y ayudarte a marcar la diferencia. Contáctame hoy mismo.",
      lcall:"Llamar", lmail:"Correo",
      warn:"El Ganoderma lucidum no reemplaza tus medicamentos: NO ES UN MEDICAMENTO, es un súper alimento 100% natural.",
      alt:"Catálogo Bienestar PRO — página ", dir:"pages"
    },
    fr:{
      htmllang:"fr",
      kicker:"Une vie pleine avec", brand:"Bienestar",
      sub:"Découvrez le merveilleux monde des champignons et comment ils agissent dans l'organisme.",
      scroll:"Faites défiler pour voir le catalogue",
      ctitle:"Comment me joindre ?",
      clead:"Aujourd'hui, c'est peut-être le début d'un véritable changement dans votre vie. J'aimerais vous accompagner et vous aider à faire la différence. Contactez-moi dès maintenant.",
      lcall:"Appeler", lmail:"Courriel",
      warn:"Le Ganoderma lucidum ne remplace pas vos médicaments : CE N'EST PAS UN MÉDICAMENT, c'est un super aliment 100 % naturel.",
      alt:"Catalogue Bienestar PRO — page ", dir:"pages-fr"
    }
  };

  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target);} });
  }, {threshold:.08});

  function buildBook(lang){
    var t = I18N[lang];
    var book = document.getElementById('book');
    book.innerHTML = '';
    for (var i=1;i<=TOTAL;i++){
      var n=(i<10?'0':'')+i;
      var fig=document.createElement('figure'); fig.className='page';
      var img=document.createElement('img');
      img.src=t.dir+'/page-'+n+'.jpg';
      img.alt=t.alt+i;
      img.loading=(i<=2?'eager':'lazy'); img.decoding='async';
      img.width=1702; img.height=2202;
      fig.appendChild(img); book.appendChild(fig);
      io.observe(fig);
    }
  }

  function setLang(lang){
    if(!I18N[lang]) lang='es';
    var t=I18N[lang];
    document.documentElement.lang=t.htmllang;
    document.querySelectorAll('[data-i]').forEach(function(el){
      var k=el.getAttribute('data-i'); if(t[k]!==undefined) el.textContent=t[k];
    });
    document.getElementById('btn-es').classList.toggle('active',lang==='es');
    document.getElementById('btn-fr').classList.toggle('active',lang==='fr');
    buildBook(lang);
    try{ localStorage.setItem('catalogo_lang',lang); }catch(e){}
  }

  // Idioma inicial: guardado > navegador (fr) > español por defecto
  var saved=null; try{ saved=localStorage.getItem('catalogo_lang'); }catch(e){}
  var nav=(navigator.language||'es').toLowerCase();
  var initial = saved || (nav.indexOf('fr')===0 ? 'fr' : 'es');
  setLang(initial);
</script>
